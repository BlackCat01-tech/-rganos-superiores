<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa mental: Tubo digestivo superior</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#f3f5fb;--bg2:#d9e0f1;--dot:rgba(27,31,42,.12);--surface:#fff;--text:#1b1f2a;--muted:#4a5163;--line:#c9cfdd;--on:#fff;--mix:#000;
  --c1:#d9480f;--c2:#6741d9;--c3:#0b7285;--c4:#2b8a3e;--hub:#1b1f2a;--hubt:#fff;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#1a1e2b;--bg2:#0b0d13;--dot:rgba(255,255,255,.08);--surface:#1c1f2a;--text:#f1f3f8;--muted:#b4bacb;--line:#3a4052;--on:#12141b;--mix:#fff;
  --c1:#ff8a4c;--c2:#b197fc;--c3:#3bc9db;--c4:#69db7c;--hub:#f1f3f8;--hubt:#12141b;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1a1e2b;--bg2:#0b0d13;--dot:rgba(255,255,255,.08);--surface:#1c1f2a;--text:#f1f3f8;--muted:#b4bacb;--line:#3a4052;--on:#12141b;--mix:#fff;
  --c1:#ff8a4c;--c2:#b197fc;--c3:#3bc9db;--c4:#69db7c;--hub:#f1f3f8;--hubt:#12141b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% 50%,var(--bg1),var(--bg2));color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;width:100%;overflow:hidden}
#stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);background-size:24px 24px;pointer-events:none}
svg.l{position:absolute;inset:0;width:100%;height:100%}
svg.l line{stroke:var(--col);stroke-width:7;stroke-linecap:round;stroke-dasharray:2 16;vector-effect:non-scaling-stroke;animation:dm 1.1s linear infinite}
@keyframes dm{to{stroke-dashoffset:-18}}
.n{position:absolute;transform:translate(-50%,-50%);border:3px solid color-mix(in srgb,var(--on) 45%,transparent);font:inherit;cursor:pointer;border-radius:30px;
  width:40%;height:25%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;
  background:linear-gradient(150deg,var(--col),color-mix(in srgb,var(--col) 68%,var(--mix)));color:var(--on);text-align:center;
  box-shadow:0 8px 22px color-mix(in srgb,var(--col) 45%,transparent),inset 0 2px 0 color-mix(in srgb,var(--on) 35%,transparent);animation:pop .4s ease both}
.n:active{transform:translate(-50%,-50%) scale(.96)}
.n b{font-size:clamp(24px,5vw,40px);line-height:1.1}
.n small{font-size:clamp(16px,3vw,22px);font-weight:600;line-height:1.1}
.em{font-size:clamp(30px,7vw,46px);line-height:1}
.ic{width:clamp(34px,8vw,52px);height:clamp(34px,8vw,52px)}
.bd{position:absolute;top:-14px;left:-8px;width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--col);border:3px solid var(--col);font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:center}
.ch{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.ch i{font-style:normal;background:color-mix(in srgb,var(--on) 24%,transparent);border-radius:999px;padding:1px 9px;font-size:clamp(14px,2.5vw,18px);font-weight:700}
.hub{width:36%;height:22%;border-radius:999px;background:var(--hub);color:var(--hubt);cursor:default;border-color:var(--hubt);
  box-shadow:0 0 0 7px color-mix(in srgb,var(--hub) 18%,transparent),0 0 0 15px color-mix(in srgb,var(--hub) 8%,transparent)}
.hub.org{background:linear-gradient(150deg,var(--col),color-mix(in srgb,var(--col) 68%,var(--mix)));color:var(--on);cursor:pointer;border-color:var(--on);
  box-shadow:0 0 0 7px color-mix(in srgb,var(--col) 25%,transparent),0 0 0 15px color-mix(in srgb,var(--col) 12%,transparent)}
.hub b{font-size:clamp(22px,4.6vw,38px)}
.hub small{font-size:clamp(16px,2.8vw,22px)}
@keyframes pop{from{opacity:0;scale:.85}to{opacity:1;scale:1}}
.fp{position:absolute;transform:translate(-50%,-50%);z-index:2;background:var(--surface);color:var(--text);border:3px solid var(--text);border-radius:999px;padding:2px 12px;font-weight:800;font-size:clamp(18px,3.4vw,26px);box-shadow:0 3px 10px rgba(0,0,0,.2)}
.top{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:.05em;font-size:clamp(17px,3.2vw,24px);color:var(--muted);text-transform:uppercase}
.pb{border:2px solid var(--text);background:var(--surface);color:var(--text);border-radius:999px;font:inherit;font-weight:800;font-size:clamp(18px,3.4vw,24px);padding:6px 14px;cursor:pointer}
#back{position:absolute;left:10px;top:10px;z-index:3}
.nav{position:absolute;right:10px;top:10px;z-index:3;display:flex;gap:6px;align-items:center;font-weight:800;font-size:clamp(18px,3.4vw,24px)}
.facts{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.facts span{background:var(--surface);border:2px solid var(--col,var(--text));color:var(--text);border-radius:999px;padding:3px 12px;font-weight:700;font-size:clamp(16px,3vw,22px)}
#modal{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px}
#modal.on{display:flex}
.card{background:var(--surface);color:var(--text);border:5px solid var(--col);border-radius:26px;width:min(94%,760px);max-height:94%;overflow:auto;padding:14px 16px;box-shadow:0 0 0 8px color-mix(in srgb,var(--col) 25%,transparent)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;color:var(--col)}
.hd span{font-size:clamp(34px,7vw,48px)}
.card h2{margin:0;font-size:clamp(26px,5.2vw,38px);line-height:1.1}
.card ul{margin:0;padding:0;list-style:none}
.card li{margin:6px 0;font-size:clamp(20px,3.8vw,27px);line-height:1.25;border-left:7px solid var(--col);background:color-mix(in srgb,var(--col) 13%,var(--surface));border-radius:12px;padding:6px 12px}
.row{display:flex;gap:8px;margin-top:10px}
.row button{border:0;border-radius:16px;background:var(--col);color:var(--on);font:inherit;font-weight:800;font-size:clamp(20px,3.6vw,26px);padding:10px 14px;cursor:pointer}
.row button[data-x]{flex:1}
</style>
</head>
<body>
<div id="stage"></div>
<div id="modal"></div>
<script>
var O=[
{n:'Boca',r:'Recibe y tritura',c:'--c1',t:[
 ['Función',['Ingestión y masticación (digestión mecánica)','Digestión química inicial: almidones y grasas','Forma el bolo alimenticio e inicia la deglución','Gusto y habla']],
 ['Estructuras',['Labios y mejillas: retienen el alimento','Lengua: mezcla, saborea y empuja el bolo','Dientes (32): cortan, desgarran y trituran','Paladar duro y blando','Masetero, temporal, pterigoideos y articulación temporomandibular']],
 ['Saliva',['Parótidas, submandibulares y sublinguales','Amilasa salival: rompe el almidón','Lipasa lingual: inicia la digestión de grasas','Mucina lubrica; lisozima defiende; bicarbonato regula el pH']],
 ['Dato clave',['El bolo sale de la boca mezclado con saliva','Inervación: trigémino (masticación), facial y glosofaríngeo (gusto)']]]},
{n:'Faringe',r:'Cruce aire y alimento',c:'--c2',t:[
 ['Función',['Conduce el bolo de la boca al esófago','Fase faríngea de la deglución: involuntaria y refleja','Protege la vía aérea al tragar']],
 ['Partes',['Tubo de unos 12–14 cm','Nasofaringe: solo aire; trompa de Eustaquio','Orofaringe: aire y alimento; amígdalas','Laringofaringe: lleva a esófago y laringe']],
 ['Estructuras',['Constrictores superior, medio e inferior: empujan el bolo','Elevadores: estilofaríngeo, palatofaríngeo, salpingofaríngeo','Epiglotis tapa la laringe; el velo del paladar cierra la nariz','Esfínter esofágico superior (cricofaríngeo)']],
 ['Control',['Plexo faríngeo: glosofaríngeo (IX) y vago (X)','Centro de la deglución en el bulbo raquídeo','Anillo de Waldeyer: tejido linfoide defensivo']]]},
{n:'Esófago',r:'Tubo de transporte',c:'--c3',t:[
 ['Función',['Transporta el bolo al estómago (unos 25 cm, de C6 a T11)','No digiere ni absorbe: lubrica y conduce','Evita el reflujo del contenido gástrico']],
 ['Capas',['Mucosa: epitelio escamoso estratificado, resistente al roce','Submucosa: glándulas que secretan moco','Muscular: tercio superior estriado, medio mixto, inferior liso','Adventicia: tejido conectivo que lo fija']],
 ['Movimiento',['Peristalsis: ondas de contracción que empujan el bolo','Hiato esofágico del diafragma (T10)','Esfínter esofágico inferior: válvula antes del estómago']],
 ['Dato clave',['Si el esfínter inferior falla aparece el reflujo gastroesofágico','Control: nervio vago y plexo mientérico (Auerbach)']]]},
{n:'Estómago',r:'Almacena y digiere',c:'--c4',t:[
 ['Función',['Reservorio: 1–1,5 L, distensible','Mezcla y tritura (digestión mecánica)','Digestión química de proteínas y defensa ácida','Forma el quimo y lo libera al duodeno']],
 ['Regiones',['Cardias → fundus → cuerpo → antro → píloro','Curvatura mayor y curvatura menor; rugas internas','Tres capas musculares: oblicua, circular y longitudinal']],
 ['Células',['Mucosas: moco y bicarbonato (protegen la pared)','Parietales: ácido clorhídrico y factor intrínseco (B12)','Principales: pepsinógeno y lipasa gástrica','G: gastrina · ECL: histamina · D: somatostatina']],
 ['Control',['Fases cefálica, gástrica e intestinal','Vago y gastrina estimulan la secreción','pH de 1,5 a 3,5; vaciado en 2–4 h por el píloro']]]}
];
var P=[[25,27],[75,27],[75,73],[25,73]];
var FL=[[50,27,'→'],[75,50,'Deglución ↓'],[50,73,'←']];
var X=[
{ch:['Dientes','Lengua'],f:['🦷 32 dientes adultos','💧 3 pares de glándulas','💧 Saliva: 1–1,5 L al día','🧪 pH ≈ 6,8']},
{ch:['Epiglotis','Constrictores'],f:['📏 12–14 cm','🧩 3 porciones','⏱️ Fase faríngea ≈ 1 s','🧠 Nervios IX y X']},
{ch:['Peristalsis','Esfínteres'],f:['📏 ≈ 25 cm','🧱 4 capas','🔻 3 estrechamientos','⏱️ Tránsito ≈ 5–10 s']},
{ch:['HCl','Pepsina'],f:['🫙 1–1,5 L','🧪 pH 1,5–3,5','⏱️ Vaciado 2–4 h','🗺️ 5 regiones']}];
var IC=['<path d="M5 26Q15 12 24 19Q33 12 43 26Q33 40 24 36Q15 40 5 26Z"/><path d="M8 26H40"/>',
'<path d="M8 9H40L30 26V40H18V26Z"/>',
'<path d="M24 5V13Q24 19 19 24Q15 29 24 34V43" stroke-width="7"/>',
'<path d="M17 5V15Q7 21 10 33Q14 44 28 42Q42 40 40 28Q38 20 30 18V9"/>'];
var TE={'Función':'⚙️','Estructuras':'🧩','Saliva':'💧','Dato clave':'⭐','Partes':'📐','Control':'🧠','Capas':'🧱','Movimiento':'🌊','Regiones':'🗺️','Células':'🔬'};
var st=document.getElementById('stage'),md=document.getElementById('modal'),view=null,tp=0;
function ico(i){return '<svg class="ic" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">'+IC[i]+'</svg>'}
function lines(col){var s='<svg class="l" viewBox="0 0 100 100" preserveAspectRatio="none" style="--col:'+col+'">';
 P.forEach(function(p){s+='<line x1="50" y1="50" x2="'+p[0]+'" y2="'+p[1]+'"/>'});return s+'</svg>'}
function pos(i){return 'left:'+P[i][0]+'%;top:'+P[i][1]+'%'}
function render(){
 var h='';
 if(view===null){
  h+='<div class="top">Sistema digestivo · tramo superior</div>'+lines('var(--hub)');
  h+='<div class="n hub" style="left:50%;top:50%"><b>Tubo digestivo superior</b><small>Toca un órgano</small></div>';
  O.forEach(function(o,i){
   h+='<button class="n" data-o="'+i+'" style="--col:var('+o.c+');'+pos(i)+'"><span class="bd">'+(i+1)+'</span>'+ico(i)+'<b>'+o.n+'</b><small>'+o.r+'</small><span class="ch"><i>'+X[i].ch[0]+'</i><i>'+X[i].ch[1]+'</i></span></button>'});
  FL.forEach(function(f){h+='<div class="fp" style="left:'+f[0]+'%;top:'+f[1]+'%">'+f[2]+'</div>'});
  h+='<div class="facts"><span>Recorrido: boca → faringe → esófago → estómago</span></div>';
 }else{
  var o=O[view],v='--col:var('+o.c+');';
  h+='<button class="pb" id="back" data-b="1">← Mapa</button><div class="nav"><button class="pb" data-g="-1">‹</button>'+(view+1)+'/4<button class="pb" data-g="1">›</button></div>'+lines('var('+o.c+')');
  h+='<button class="n hub org" data-b="1" style="'+v+'left:50%;top:50%">'+ico(view)+'<b>'+o.n+'</b><small>'+o.r+'</small></button>';
  o.t.forEach(function(t,i){h+='<button class="n" data-t="'+i+'" style="'+v+pos(i)+'"><span class="em">'+(TE[t[0]]||'•')+'</span><b>'+t[0]+'</b><small>'+t[1].length+' puntos</small></button>'});
  h+='<div class="facts" style="'+v+'">';X[view].f.forEach(function(f){h+='<span>'+f+'</span>'});h+='</div>';
 }
 st.innerHTML=h;
}
function openT(i){
 tp=i;var o=O[view],t=o.t[i],s='<div class="card" style="--col:var('+o.c+')"><div class="hd"><span>'+(TE[t[0]]||'•')+'</span><h2>'+o.n+': '+t[0]+'</h2></div><ul>';
 t[1].forEach(function(x){s+='<li>'+x+'</li>'});
 md.innerHTML=s+'</ul><div class="row"><button data-p="-1">‹</button><button data-x="1">Cerrar</button><button data-p="1">›</button></div></div>';md.className='on';
}
function closeM(){md.className='';md.innerHTML=''}
st.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.o!==undefined){view=+b.dataset.o;render()}
 else if(b.dataset.b){view=null;render()}
 else if(b.dataset.g){view=(view+ +b.dataset.g+4)%4;render()}
 else if(b.dataset.t!==undefined){openT(+b.dataset.t)}
});
md.addEventListener('click',function(e){
 var b=e.target.closest('button');
 if(e.target===md||(b&&b.dataset.x))closeM();
 else if(b&&b.dataset.p)openT((tp+ +b.dataset.p+4)%4);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(md.className==='on')closeM();else if(view!==null){view=null;render()}}});
render();
</script>
</body>
</html>
